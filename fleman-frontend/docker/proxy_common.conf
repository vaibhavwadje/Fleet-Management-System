# Shared by every proxied location, so a fix applies to all of them at once.
#
# NOT a template - these values are computed by nginx per request and must
# survive envsubst untouched. That is exactly why this is a separate file:
# envsubst runs over /etc/nginx/templates/ only, and $host or $scheme sitting
# in a template would be replaced with an empty string, breaking the OAuth
# redirect in a way that is very hard to see.

proxy_http_version 1.1;

# $http_host, NOT $host.
#
# They look interchangeable and are not: $host is the hostname with the PORT
# STRIPPED, while $http_host is the Host header exactly as the browser sent it.
# With $host, Spring Security rebuilt its OAuth redirect_uri as
# http://localhost/login/oauth2/code/google - no :5174 - and Google answered
# redirect_uri_mismatch against the URI that was correctly registered.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# How the backend learns it was reached as http://localhost:5174 rather than
# as http://server:8080, which is all it can see for itself.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;

# X-Forwarded-Port is deliberately NOT set.
#
# The only value available here is $server_port, which is nginx's listen port
# INSIDE the container - 80 - not the 5174 the browser used. Docker's port
# publishing happens outside nginx, so nginx genuinely cannot know the public
# port; there is nothing correct to put here.
#
# Sending 80 was worse than sending nothing: Spring gives X-Forwarded-Port
# priority over the port in X-Forwarded-Host, so it overrode the correct :5174
# with 80, then dropped it as the default for http. Omitting the header lets
# the port in X-Forwarded-Host stand, which is the right one.

# The OAuth handshake sets a correlation cookie on the backend's response and
# reads it back on the callback. Rewriting the path to / keeps it visible on
# both legs.
proxy_cookie_path / /;

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
